crons:
  - name: lead-followups
    description: "Queues AI follow-up drafts for leads that have gone quiet for 48 hours"
    cron: "0 * * * *"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/lead-followups"
    method: POST
    enabled: true
  - name: weekly-digest
    description: "Emails each tenant's weekly client digest every Monday, per-tenant send hour"
    cron: "0 * * * 1"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/weekly-digest"
    method: POST
    enabled: true
  - name: archive-test-leads
    description: "Auto-archives test/dummy leads older than 30 days so the Test tab stays tidy"
    cron: "0 3 * * *"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/archive-test-leads"
    method: POST
    enabled: true
