name: Apply Preview Virtualenv Patch

on:
  push:
    branches: ["feature/lucio-dev-agent-phase2"]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !startsWith(github.event.head_commit.message, 'Apply generated preview virtualenv patch') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/lucio-dev-agent-phase2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply patch
        run: python scripts/apply_preview_venv_patch.py
      - name: Verify syntax
        run: python -m py_compile runner/server.py
      - name: Commit generated change
        run: |
          git config user.name "Lucio Dev Agent CI"
          git config user.email "dev-agent@lucio.local"
          git add runner/server.py
          if git diff --cached --quiet; then
            echo "No generated change"
            exit 0
          fi
          git commit -m "Apply generated preview virtualenv patch"
          git push origin HEAD:feature/lucio-dev-agent-phase2
