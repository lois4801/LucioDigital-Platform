name: Apply Dev Agent Phase 2

on:
  push:
    branches: ["feature/lucio-dev-agent-phase2"]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !startsWith(github.event.head_commit.message, 'Apply generated Dev Agent Phase 2 changes') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/lucio-dev-agent-phase2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply patch
        run: python scripts/run_dev_agent_phase2_patch.py
      - name: Verify syntax and frontend build
        run: |
          python -m py_compile backend/dev_agent.py runner/server.py runner/entrypoint.py
          cd frontend
          corepack enable
          yarn install --frozen-lockfile
          yarn build
      - name: Commit generated changes
        run: |
          git config user.name "Lucio Dev Agent CI"
          git config user.email "dev-agent@lucio.local"
          git add backend/dev_agent.py runner/server.py frontend/src/components/DevAgentPanel.tsx
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Apply generated Dev Agent Phase 2 changes"
          git push origin HEAD:feature/lucio-dev-agent-phase2
