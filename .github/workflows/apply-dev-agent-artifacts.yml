name: Apply Dev Agent Artifacts

on:
  push:
    branches: ["feature/dev-agent-artifacts"]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !startsWith(github.event.head_commit.message, 'Apply generated Dev Agent artifacts') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dev-agent-artifacts
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply artifact patch
        run: python scripts/apply_dev_agent_artifacts.py
      - name: Verify backend and runner syntax
        run: python -m py_compile backend/dev_agent.py runner/server.py runner/entrypoint.py
      - name: Verify runner archive behavior
        run: |
          pip install -r runner/requirements.txt
          cd runner
          NEXUS_RUNNER_ALLOW_INSECURE=true WORKSPACE_ROOT=/tmp/lucio-artifact-ci python - <<'PY'
          import shutil
          from pathlib import Path
          import server

          root = Path('/tmp/lucio-artifact-smoke')
          shutil.rmtree(root, ignore_errors=True)
          root.mkdir(parents=True)
          (root / 'src').mkdir()
          (root / 'src' / 'app.txt').write_text('hello lucio')
          (root / '.env').write_text('MUST_NOT_EXPORT=secret')
          (root / 'node_modules').mkdir()
          (root / 'node_modules' / 'ignored.js').write_text('ignored')
          data, count = server._workspace_archive(root)
          assert count == 1, count
          import io, zipfile
          names = zipfile.ZipFile(io.BytesIO(data)).namelist()
          assert names == ['src/app.txt'], names
          print('Archive smoke test passed')
          PY
      - name: Verify frontend production build
        run: |
          cd frontend
          corepack enable
          yarn install --frozen-lockfile
          yarn build
      - name: Commit generated changes
        run: |
          git config user.name "Lucio Dev Agent CI"
          git config user.email "dev-agent@lucio.local"
          git add runner/server.py backend/dev_agent.py frontend/src/components/DevAgentPanel.tsx
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Apply generated Dev Agent artifacts"
          git push origin HEAD:feature/dev-agent-artifacts
