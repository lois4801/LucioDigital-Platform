name: Dev Agent CI

on:
  push:
    branches: ["feature/lucio-dev-agent"]
  pull_request:
    paths:
      - "backend/dev_agent.py"
      - "backend/sandbox_guard.py"
      - "frontend/src/components/DevAgentPanel.tsx"
      - "frontend/src/pages/AppDetail.tsx"
      - "frontend/tsconfig.json"
      - "runner/**"
      - ".github/workflows/dev-agent-ci.yml"

jobs:
  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Dev Agent and Runner
        run: python -m py_compile backend/dev_agent.py backend/sandbox_guard.py runner/server.py runner/entrypoint.py
      - name: Install runner dependencies
        run: pip install -r runner/requirements.txt
      - name: Import Nexus Runner
        working-directory: runner
        env:
          NEXUS_RUNNER_ALLOW_INSECURE: "true"
        run: python -c "import server; print(server.app.title)"
      - name: Smoke test isolated app scaffolds
        working-directory: runner
        env:
          NEXUS_RUNNER_ALLOW_INSECURE: "true"
          WORKSPACE_ROOT: /tmp/lucio-ci-workspaces
        run: |
          python - <<'PY'
          import shutil
          from pathlib import Path
          import server

          fast = Path('/tmp/lucio-fastapi-smoke')
          react = Path('/tmp/lucio-react-smoke')
          shutil.rmtree(fast, ignore_errors=True)
          shutil.rmtree(react, ignore_errors=True)

          info = server._scaffold_workspace(fast, 'fastapi', 'Lucio FastAPI Smoke')
          detected = server._detect(fast)
          assert info['preset'] == 'fastapi'
          assert (fast / '.venv' / 'bin' / 'python').exists()
          assert detected['preview'][-1] == '{port}'
          result = server._run(fast, ['python', '-m', 'py_compile', 'main.py'])
          assert result['ok'], result

          info = server._scaffold_workspace(react, 'react-vite', 'Lucio React Smoke')
          detected = server._detect(react)
          assert info['preset'] == 'react-vite'
          assert '{port}' in detected['preview'] and '{base}' in detected['preview']
          result = server._run(react, ['npm', 'run', 'build'])
          assert result['ok'], result

          shutil.rmtree(fast, ignore_errors=True)
          shutil.rmtree(react, ignore_errors=True)
          print('Scaffold smoke tests passed')
          PY

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"
          cache-dependency-path: frontend/yarn.lock
      - run: corepack enable
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Baseline typecheck
        continue-on-error: true
        run: yarn typecheck
      - name: Production build
        run: yarn build
