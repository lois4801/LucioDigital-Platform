name: Apply Dev Agent Phase 2 Hardening

on:
  push:
    branches: ["feature/lucio-dev-agent-phase2"]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !startsWith(github.event.head_commit.message, 'Apply generated Phase 2 hardening') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/lucio-dev-agent-phase2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply hardening patch
        run: python scripts/apply_phase2_hardening.py
      - name: Verify runner
        run: |
          python -m py_compile runner/server.py runner/entrypoint.py backend/dev_agent.py
          cd runner
          pip install -r requirements.txt
          NEXUS_RUNNER_ALLOW_INSECURE=true WORKSPACE_ROOT=/tmp/lucio-ci python -c "import server; print(server.app.title)"
      - name: Commit generated changes
        run: |
          git config user.name "Lucio Dev Agent CI"
          git config user.email "dev-agent@lucio.local"
          git add runner/server.py
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Apply generated Phase 2 hardening"
          git push origin HEAD:feature/lucio-dev-agent-phase2
